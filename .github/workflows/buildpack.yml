name: Buildpack compatibility

on:
  push:
    branches:
      - 'master'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Test buildpack ability to create Jekyll site
        uses: buildpack-ci/run-tests@v1
      - name: Archive static files
        uses: actions/upload-artifact@v7
        with:
          name: jekyll-static-output
          path: _site
          retention-days: 7