version: 2

multi-ecosystem-groups:
  environment:
    schedule:
      interval: "monthly"
    assignees:
      - "asset-web"

updates:
  - package-ecosystem: "bundler"
    multi-ecosystem-group: "environment"
    directory: "/"
  - package-ecosystem: "docker"
    multi-ecosystem-group: "environment"
    directory: "/"
    # Filter out major updates for  Docker image
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    multi-ecosystem-group: "environment"
    directory: "/"
